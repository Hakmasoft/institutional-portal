[project]
name = "institutional-portal"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
    "django>=5.2,<6.0",
    "django-environ>=0.14.0",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
