databases:
  - name: institutional-portal-db
    plan: free
    databaseName: institutional_portal
    user: institutional_portal
    region: frankfurt

services:
  - type: web
    name: institutional-portal
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: "./build.sh"
    startCommand: "uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile - --error-logfile -"
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: institutional-portal-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.14.7"
