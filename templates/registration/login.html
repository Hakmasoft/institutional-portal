{% extends "base.html" %}

{% block title %}Log in &middot; Institutional Portal{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm">
    <c-card padded>
        <h1 class="mt-0">Log in</h1>
        <p class="text-sm text-text-muted">Sign in to access your portal.</p>

        {% if form.non_field_errors %}
            <c-flash variant="error">
                {% for err in form.non_field_errors %}{{ err }}{% endfor %}
            </c-flash>
        {% endif %}

        <form method="post" class="stack">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <c-field label="Username" name="username">
                <input type="text" name="username" id="id_username"
                       value="{{ form.username.value|default:'' }}"
                       autofocus autocomplete="username" required>
            </c-field>

            <c-field label="Password" name="password">
                <input type="password" name="password" id="id_password"
                       autocomplete="current-password" required>
            </c-field>

            <c-button variant="primary" type="submit" block>Log in</c-button>
        </form>
    </c-card>
</div>
{% endblock %}
